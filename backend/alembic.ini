# Alembic 配置（《开发任务文档》M0-2 / M1-1）
# 迁移命令（在 backend/ 目录下执行）：
#   alembic revision --autogenerate -m "msg"
#   alembic upgrade head
#   alembic downgrade base && alembic upgrade head   # 重放校验

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# 实际连接串由 migrations/env.py 从 app.core.config.settings 读取，此处留空占位
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S